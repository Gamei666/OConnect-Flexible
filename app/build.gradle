// Modified for OConnect Flexible. Fork snapshot 2026-11-20.
plugins {
    id 'com.android.application'
}

android {
    namespace = 'app.openconnect'
    compileSdk = 37

    defaultConfig {
        applicationId = "app.openconnect.domainsplit"
        minSdk = 29
        targetSdk = 36
        versionCode = 1137
        versionName = "1.17.0-flexible.2"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        aidl = true
        buildConfig = true
    }
    sourceSets {
        main.java.srcDirs += [
                '../external/openconnect/java/src/org/infradead/libopenconnect',
                '../external/stoken/java/src/org/stoken',
        ]
    }
    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
    }
    packaging {
        jniLibs {
            // The bundled CSD/HIP helpers must be executable from nativeLibraryDir.
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation files('libs/hev-socks5-tunnel-2.20.0.aar')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.google.android.material:material:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
